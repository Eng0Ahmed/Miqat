[package]
name = "miqat"
version = "1.0.0"
description = "Smart Prayer & Work Alarm Desktop Application"
authors = ["Eng_Ahmed Abdelaziz"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
window-vibrancy = "0.8.1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
